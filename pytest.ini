[pytest]
# La suite automática no debe tocar la red: por defecto se excluye el test que
# llama al proveedor real, porque consume cuota en cada corrida y deja el
# resultado a merced de la latencia del servicio.
#
# Para correrlo a propósito, una vez y a sabiendas:
#     python -m pytest -m integracion
addopts = -m "not integracion"

markers =
    integracion: llama al proveedor real y consume cuota; excluido por defecto
